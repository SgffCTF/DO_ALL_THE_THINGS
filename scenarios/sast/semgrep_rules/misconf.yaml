rules:

  #
  # =========================
  # EXPOSED DATABASES
  # =========================
  #

  - id: exposed-postgres
    message: PostgreSQL exposed to host
    severity: ERROR
    languages: [yaml]

    pattern-regex: |
      ['"]?(0\.0\.0\.0:)?[0-9]+:5432(:5432)?['"]?

  - id: exposed-mysql
    message: MySQL exposed to host
    severity: ERROR
    languages: [yaml]

    pattern-regex: |
      ['"]?(0\.0\.0\.0:)?[0-9]+:3306(:3306)?['"]?

  - id: exposed-mongodb
    message: MongoDB exposed to host
    severity: ERROR
    languages: [yaml]

    pattern-regex: |
      ['"]?(0\.0\.0\.0:)?[0-9]+:27017(:27017)?['"]?

  - id: exposed-redis
    message: Redis exposed to host
    severity: ERROR
    languages: [yaml]

    pattern-regex: |
      ['"]?(0\.0\.0\.0:)?[0-9]+:6379(:6379)?['"]?

  - id: exposed-elasticsearch
    message: Elasticsearch exposed to host
    severity: WARNING
    languages: [yaml]

    pattern-regex: |
      ['"]?(0\.0\.0\.0:)?[0-9]+:9200(:9200)?['"]?


  #
  # =========================
  # HARDCODED SECRETS
  # =========================
  #

  - id: hardcoded-password
    message: Hardcoded password in compose
    severity: ERROR
    languages: [yaml]

    pattern-regex: |
      (?i)(password|passwd|pwd)\s*[:=]\s*['"]?[a-zA-Z0-9_\-./+=]{4,}

  - id: hardcoded-secret
    message: Hardcoded secret/token/api key
    severity: ERROR
    languages: [yaml]

    pattern-regex: |
      (?i)(secret|token|api[_-]?key)\s*[:=]\s*['"]?[a-zA-Z0-9_\-./+=]{6,}

  - id: hardcoded-cookie-secret
    message: Hardcoded cookie/session secret
    severity: ERROR
    languages: [yaml]

    pattern-regex: |
      (?i)(cookie|session).*secret

  - id: aws-secret
    message: AWS secret detected
    severity: ERROR
    languages: [yaml]

    pattern-regex: |
      AKIA[0-9A-Z]{16}

  - id: jwt-secret
    message: JWT secret present
    severity: ERROR
    languages: [yaml]

    pattern-regex: |
      (?i)jwt.*secret


  #
  # =========================
  # NETWORK MISCONFIGS
  # =========================
  #

  - id: bind-all-interfaces
    message: Service binds to 0.0.0.0
    severity: WARNING
    languages: [yaml]

    pattern-regex: |
      0\.0\.0\.0

  - id: network-host-mode
    message: Container uses host network mode
    severity: ERROR
    languages: [yaml]

    pattern-regex: |
      network_mode:\s*host

  - id: exposed-ssh
    message: SSH exposed to host
    severity: WARNING
    languages: [yaml]

    pattern-regex: |
      ['"]?(0\.0\.0\.0:)?[0-9]+:22(:22)?['"]?

  - id: exposed-rdp
    message: RDP exposed to host
    severity: WARNING
    languages: [yaml]

    pattern-regex: |
      ['"]?(0\.0\.0\.0:)?[0-9]+:3389(:3389)?['"]?


  #
  # =========================
  # PRIVILEGE ESCALATION
  # =========================
  #

  - id: privileged-container
    message: Privileged container detected
    severity: ERROR
    languages: [yaml]

    pattern-regex: |
      privileged:\s*true

  - id: running-as-root
    message: Container explicitly runs as root
    severity: WARNING
    languages: [yaml]

    pattern-regex: |
      user:\s*root

  - id: dangerous-cap-add
    message: Dangerous Linux capability added
    severity: ERROR
    languages: [yaml]

    pattern-regex: |
      SYS_ADMIN|NET_ADMIN|SYS_PTRACE|DAC_READ_SEARCH|DAC_OVERRIDE

  - id: no-new-privileges-disabled
    message: no-new-privileges disabled
    severity: ERROR
    languages: [yaml]

    pattern-regex: |
      no-new-privileges:false

  - id: seccomp-unconfined
    message: seccomp disabled
    severity: ERROR
    languages: [yaml]

    pattern-regex: |
      seccomp:unconfined

  - id: apparmor-unconfined
    message: AppArmor disabled
    severity: ERROR
    languages: [yaml]

    pattern-regex: |
      apparmor:unconfined


  #
  # =========================
  # DANGEROUS MOUNTS
  # =========================
  #

  - id: docker-sock-mounted
    message: Docker socket mounted into container
    severity: CRITICAL
    languages: [yaml]

    pattern-regex: |
      /var/run/docker\.sock

  - id: host-root-mounted
    message: Host root filesystem mounted
    severity: CRITICAL
    languages: [yaml]

    pattern-regex: |
      -\s*/:/.*

  - id: proc-mounted
    message: Host /proc mounted
    severity: ERROR
    languages: [yaml]

    pattern-regex: |
      -\s*/proc:/.*

  - id: docker-binary-mounted
    message: Docker binary mounted into container
    severity: ERROR
    languages: [yaml]

    pattern-regex: |
      /usr/bin/docker

  - id: ssh-mounted
    message: SSH directory mounted
    severity: WARNING
    languages: [yaml]

    pattern-regex: |
      \.ssh


  #
  # =========================
  # IMAGE HYGIENE
  # =========================
  #

  - id: latest-tag
    message: Avoid latest tag
    severity: WARNING
    languages: [yaml]

    pattern-regex: |
      image:\s*.*:latest

  - id: unpinned-image
    message: Image tag not pinned
    severity: WARNING
    languages: [yaml]

    pattern-regex: |
      image:\s*[a-zA-Z0-9/_-]+$

  - id: dockerhub-image
    message: Public DockerHub image used
    severity: INFO
    languages: [yaml]

    pattern-regex: |
      image:\s*(ubuntu|alpine|nginx|redis|postgres|mysql)


  #
  # =========================
  # CTF / AD SPECIFIC
  # =========================
  #

  - id: kerberos-port-exposed
    message: Kerberos exposed
    severity: WARNING
    languages: [yaml]

    pattern-regex: |
      ['"]?(0\.0\.0\.0:)?[0-9]+:88(:88)?['"]?

  - id: ldap-port-exposed
    message: LDAP exposed
    severity: WARNING
    languages: [yaml]

    pattern-regex: |
      ['"]?(0\.0\.0\.0:)?[0-9]+:389(:389)?['"]?

  - id: ldaps-port-exposed
    message: LDAPS exposed
    severity: WARNING
    languages: [yaml]

    pattern-regex: |
      ['"]?(0\.0\.0\.0:)?[0-9]+:636(:636)?['"]?

  - id: smb-port-exposed
    message: SMB exposed
    severity: WARNING
    languages: [yaml]

    pattern-regex: |
      ['"]?(0\.0\.0\.0:)?[0-9]+:445(:445)?['"]?

  - id: winrm-port-exposed
    message: WinRM exposed
    severity: WARNING
    languages: [yaml]

    pattern-regex: |
      ['"]?(0\.0\.0\.0:)?[0-9]+:5985(:5985)?['"]?

  - id: powershell-download-cradle
    message: Possible PowerShell download cradle
    severity: ERROR
    languages: [yaml]

    pattern-regex: |
      iwr |Invoke-WebRequest|DownloadString

  - id: encoded-powershell
    message: Encoded PowerShell detected
    severity: ERROR
    languages: [yaml]

    pattern-regex: |
      powershell.*-enc